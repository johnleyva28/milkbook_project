name: milkbook_project

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    labels:
      - "logging=promtail"

  migrate:
    image: node:20-alpine
    restart: "no"
    working_dir: /db
    volumes:
      - ./milkbook_db:/db:ro
    command: ["sh", "-c", "npm ci && npx prisma migrate deploy"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "logging=promtail"

  backend:
    build:
      context: ./milkbook_backend
      additional_contexts:
        - db=./milkbook_db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT}:3000"
    labels:
      - "logging=promtail"

  frontend:
    build:
      context: ./milkbook_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    labels:
      - "logging=promtail"

  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    user: "0:0"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./milkbook_logs/loki:/etc/loki:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    labels:
      - "logging=promtail"

  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./milkbook_logs/promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9080/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    labels:
      - "logging=promtail"

  grafana:
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./milkbook_logs/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    labels:
      - "logging=promtail"

volumes:
  postgres_data:
  loki_data:
  grafana_data:
