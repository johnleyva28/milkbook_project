<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MilkBook — Prototipo: Confirmar Litros (Juan)</title>
<link rel="stylesheet" href="../2_mockups/shared_styles.css">
<style>
  .stage {
    background: #E8E2D5;
    min-height: 100vh;
    padding: 24px;
    font-family: var(--font-ui);
  }
  .stage-header {
    max-width: 800px;
    margin: 0 auto 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stage-header h1 {
    font-family: var(--font-display);
    font-size: 22px;
    margin: 0;
  }
  .stage-header .sub { font-size: 12px; color: var(--text-soft); margin-top: 4px; }
  .stage-nav { display: flex; gap: 8px; align-items: center; }
  .stage-nav button {
    background: var(--text);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .stage-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
  .stage-nav button.primary { background: var(--green-500); }
  .stage-nav .label { font-size: 13px; color: var(--text-soft); }
  .step-label {
    text-align: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .step-label strong { color: var(--green-700); }
  .stage-content { display: flex; justify-content: center; }

  /* PIN screen */
  .pin-screen {
    background: var(--cream-50);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    max-width: 360px;
  }
  .pin-screen h2 { font-size: 18px; margin-bottom: 8px; }
  .pin-screen .sub { font-size: 14px; color: var(--text-soft); margin-bottom: 24px; }
  .pin-dots {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .pin-dot {
    width: 16px; height: 16px;
    border: 2px solid var(--cream-400);
    border-radius: 50%;
  }
  .pin-dot.filled { background: var(--green-500); border-color: var(--green-500); }
  .pin-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 280px;
    margin: 0 auto;
  }
  .pin-key {
    aspect-ratio: 1.4;
    background: white;
    border: 2px solid var(--cream-300);
    border-radius: 12px;
    font-family: var(--font-data);
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
  }
  .pin-key:active { background: var(--green-100); }
  .pin-key.empty { border: none; background: transparent; cursor: default; }
  .pin-key.action { font-size: 22px; }

  /* Confirmación final */
  .success-screen {
    background: white;
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    max-width: 360px;
  }
  .success-screen .icon {
    width: 80px; height: 80px;
    background: var(--green-500);
    color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    margin: 0 auto 16px;
  }
  .success-screen h2 {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--green-700);
    margin-bottom: 8px;
  }
  .success-screen .sub {
    font-size: 14px;
    color: var(--text-soft);
    margin-bottom: 20px;
  }
  .success-screen .summary {
    background: var(--cream-100);
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    text-align: left;
  }
  .success-screen .summary .row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-header">
    <div>
      <h1>Prototipo: Confirmar Litros (Juan)</h1>
      <div class="sub">⭐ La pantalla MÁS IMPORTANTE para Juan · Simula el flujo de confirmación con PIN</div>
    </div>
    <div class="stage-nav">
      <button onclick="irAtras()" id="btn-atras">← Atrás</button>
      <span class="label">Paso <span id="paso-num">1</span>/3</span>
      <button onclick="irAdelante()" id="btn-adelante" class="primary">Siguiente →</button>
    </div>
  </div>

  <div class="step-label" id="step-label">
    Paso <strong>1</strong>: Pantalla inicial — Carlos ya recogió
  </div>

  <div class="stage-content" id="screen-container">
    <!-- contenido dinámico -->
  </div>
</div>

<script>
  let pasoActual = 1;
  const pasoTotal = 3;

  function renderPantalla1() {
    return `
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="status-bar"><span class="time">6:35</span><div class="right"><span>📶 3G</span><span style="font-size: 11px;">68%</span><div class="battery-icon"><div class="level"></div></div></div></div>
          <div class="app-bar"><div class="back">←</div><div class="title">Confirmar litros de hoy</div></div>
          <div class="content">
            <div style="background: var(--green-100); border: 2px solid var(--green-500); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 16px;">
              <div style="font-size: 32px; margin-bottom: 6px;">✓</div>
              <div style="font-weight: 700; font-size: 15px; color: var(--green-700);">Carlos recogió tu leche</div>
              <div style="font-size: 12px; color: var(--green-700); margin-top: 4px;">A las 6:32 AM · te toca confirmar</div>
            </div>
            <div style="background: white; border: 2px solid var(--cream-400); border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 16px;">
              <div style="font-size: 13px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">Litros que Carlos recogió</div>
              <div style="font-family: var(--font-data); font-size: 72px; font-weight: 700; line-height: 1; color: var(--text);">17.5<span style="font-size: 32px; color: var(--text-soft);"> L</span></div>
              <div style="font-size: 13px; color: var(--text-soft); margin-top: 8px;">Si coincide, toca CONFIRMAR</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <button style="background: var(--cream-100); border: 1px solid var(--cream-300); border-radius: 8px; padding: 12px; font-family: var(--font-data); font-size: 18px; font-weight: 700;">+0.5</button>
              <button style="background: var(--cream-100); border: 1px solid var(--cream-300); border-radius: 8px; padding: 12px; font-family: var(--font-data); font-size: 18px; font-weight: 700;">−0.5</button>
            </div>
          </div>
          <div style="background: white; border-top: 1px solid var(--cream-300); padding: 12px 16px; padding-bottom: 20px;">
            <button onclick="irAdelante()" class="btn btn-primary btn-large">✓ CONFIRMAR 17.5 L</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderPantalla2() {
    return `
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="status-bar"><span class="time">6:38</span><div class="right"><span>📶 3G</span><span style="font-size: 11px;">65%</span><div class="battery-icon"><div class="level"></div></div></div></div>
          <div class="app-bar"><div class="back">←</div><div class="title">Ingresa tu PIN</div></div>
          <div class="content" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div style="text-align: center; padding: 24px;">
              <div style="font-size: 32px; margin-bottom: 8px;">🔒</div>
              <h2 style="font-size: 18px; margin-bottom: 4px;">Ingresa tu PIN</h2>
              <div style="font-size: 13px; color: var(--text-soft);">Para confirmar 17.5 L</div>
            </div>
            <div class="pin-dots">
              <div class="pin-dot filled"></div>
              <div class="pin-dot filled"></div>
              <div class="pin-dot filled"></div>
              <div class="pin-dot"></div>
            </div>
            <div class="pin-keypad">
              <button class="pin-key" onclick="pressKey(this)">1</button>
              <button class="pin-key" onclick="pressKey(this)">2</button>
              <button class="pin-key" onclick="pressKey(this)">3</button>
              <button class="pin-key" onclick="pressKey(this)">4</button>
              <button class="pin-key" onclick="pressKey(this)">5</button>
              <button class="pin-key" onclick="pressKey(this)">6</button>
              <button class="pin-key" onclick="pressKey(this)">7</button>
              <button class="pin-key" onclick="pressKey(this)">8</button>
              <button class="pin-key" onclick="pressKey(this)">9</button>
              <button class="pin-key empty"></button>
              <button class="pin-key" onclick="pressKey(this)">0</button>
              <button class="pin-key action" onclick="pressBackspace()">⌫</button>
            </div>
            <button style="margin-top: 16px; background: transparent; border: none; color: var(--blue-500); font-weight: 700; font-size: 14px;">¿Olvidaste tu PIN?</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderPantalla3() {
    return `
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="status-bar"><span class="time">6:40</span><div class="right"><span>📶 3G</span><span style="font-size: 11px;">63%</span><div class="battery-icon"><div class="level"></div></div></div></div>
          <div class="app-bar"><div class="title">Confirmado ✓</div></div>
          <div class="content" style="padding: 24px;">
            <div class="success-screen" style="margin: 0; padding: 0;">
              <div class="icon">✓</div>
              <h2>17.5 L confirmados</h2>
              <div class="sub">Tu firma quedó registrada</div>
              <div class="summary">
                <div class="row"><span>Fecha:</span><strong>17 sept 2026</strong></div>
                <div class="row"><span>Carlos recogió:</span><strong>17.5 L</strong></div>
                <div class="row"><span>Tu firma:</span><strong>PIN ✓</strong></div>
                <div class="row"><span>Estado:</span><strong style="color: var(--green-700);">CONFIRMADO</strong></div>
              </div>
              <div style="background: var(--green-100); padding: 12px; border-radius: 8px; font-size: 13px;">
                ✓ Carlos ya recibió tu confirmación
              </div>
            </div>
            <button onclick="reset()" class="btn btn-secondary" style="margin-top: 24px;">← Reiniciar prototipo</button>
          </div>
        </div>
      </div>
    `;
  }

  function actualizarPantalla() {
    const map = { 1: renderPantalla1, 2: renderPantalla2, 3: renderPantalla3 };
    document.getElementById('screen-container').innerHTML = map[pasoActual]();
    document.getElementById('step-label').innerHTML = `Paso <strong>${pasoActual}</strong>: ${getLabel(pasoActual)}`;
    document.getElementById('paso-num').textContent = pasoActual;
    document.getElementById('btn-atras').disabled = pasoActual === 1;
    document.getElementById('btn-adelante').disabled = pasoActual === pasoTotal;
  }

  function getLabel(p) {
    return ['', 'Pantalla inicial — Carlos ya recogió', 'Ingresar PIN para confirmar', 'Confirmación exitosa'][p];
  }

  function irAdelante() {
    if (pasoActual < pasoTotal) { pasoActual++; actualizarPantalla(); window.scrollTo(0,0); }
  }
  function irAtras() {
    if (pasoActual > 1) { pasoActual--; actualizarPantalla(); window.scrollTo(0,0); }
  }
  function reset() {
    pasoActual = 1;
    actualizarPantalla();
    window.scrollTo(0,0);
  }

  function pressKey(btn) {
    // Solo funciona en paso 2
    if (pasoActual !== 2) return;
    const dots = document.querySelectorAll('.pin-dot');
    const nextEmpty = Array.from(dots).findIndex(d => !d.classList.contains('filled'));
    if (nextEmpty >= 0 && nextEmpty < 4) {
      dots[nextEmpty].classList.add('filled');
      if (nextEmpty === 3) {
        // PIN completo → ir a paso 3 después de 500ms
        setTimeout(() => irAdelante(), 600);
      }
    }
  }

  function pressBackspace() {
    if (pasoActual !== 2) return;
    const dots = document.querySelectorAll('.pin-dot');
    const lastFilled = Array.from(dots).map((d,i) => d.classList.contains('filled') ? i : -1).filter(i => i >= 0).pop();
    if (lastFilled !== undefined) {
      dots[lastFilled].classList.remove('filled');
    }
  }

  actualizarPantalla();
</script>
</body>
</html>
